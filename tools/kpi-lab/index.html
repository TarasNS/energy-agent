<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Energy harness — KPI chat (synthetic)</title>
<style>
:root {
  --ns-green: #1A5C00; --ns-almost-black: #1C1C1C; --ns-off-white: #F4F2EB; --ns-white: #FFFFFF;
  --font-ui: Aptos, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg: var(--ns-off-white); --surface: var(--ns-white); --text: var(--ns-almost-black);
  --border: color-mix(in srgb, var(--ns-almost-black) 22%, var(--ns-off-white));
  --muted-border: color-mix(in srgb, var(--ns-almost-black) 14%, var(--ns-off-white));
  --focus: var(--ns-almost-black);
  --shadow: 0 1px 2px rgb(28 28 28 / .08), 0 4px 14px rgb(28 28 28 / .08);
  --shadow-up: 0 -2px 12px rgb(28 28 28 / .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--ns-almost-black); --surface: color-mix(in srgb, var(--ns-white) 6%, var(--ns-almost-black));
    --text: var(--ns-white); --border: color-mix(in srgb, var(--ns-white) 35%, var(--ns-almost-black));
    --muted-border: color-mix(in srgb, var(--ns-white) 18%, var(--ns-almost-black));
    --focus: var(--ns-white);
    --shadow: 0 1px 2px rgb(0 0 0 / .5), 0 4px 14px rgb(0 0 0 / .45);
    --shadow-up: 0 -2px 12px rgb(0 0 0 / .5);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 16px; line-height: 1.5; }
header.top { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.25rem; background: var(--surface); box-shadow: var(--shadow); position: relative; z-index: 2; }
header.top h1 { font-size: 1.25rem; margin: 0; font-weight: 700; }
header.top .tag { font-size: .85rem; background: var(--bg); border-radius: 4px; padding: .1rem .45rem; }
.chat { max-width: 920px; margin: 0 auto; padding: 1.25rem 1rem 8rem; display: flex; flex-direction: column; gap: 1rem; }
.msg { max-width: 100%; }
.msg.user { align-self: flex-end; background: var(--ns-green); color: var(--ns-white); border: 1px solid var(--text); padding: .6rem .9rem; border-radius: 12px 12px 2px 12px; max-width: 70%; }
.msg.bot { background: var(--surface); box-shadow: var(--shadow); border-radius: 12px 12px 12px 2px; padding: 1rem 1.1rem; }
.msg.bot pre { white-space: pre-wrap; font-family: var(--font-ui); margin: 0 0 .75rem; font-size: 1rem; }
.tiles { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin: .5rem 0 .75rem; }
.tile { background: var(--surface); box-shadow: var(--shadow); border-radius: 8px; padding: .55rem .7rem; }
.tile .k { font-size: .82rem; }
.tile .v { font-size: 1.45rem; font-weight: 700; letter-spacing: -.02em; }
.tile.unavailable { border-style: dashed; }
.tile.unavailable .v { font-size: 1rem; font-weight: 600; }
.tile .why { font-size: .8rem; margin-top: .2rem; }
figure { margin: .5rem 0 .75rem; box-shadow: var(--shadow); border-radius: 8px; padding: .6rem .7rem; }
figcaption { font-size: .9rem; font-weight: 600; margin-bottom: .35rem; }
svg { width: 100%; height: auto; display: block; }
svg text { fill: var(--text); font-family: var(--font-ui); font-size: 11px; }
details { margin-top: .4rem; font-size: .9rem; }
details summary { cursor: pointer; font-weight: 600; }
details ul { margin: .4rem 0 0; padding-left: 1.1rem; font-family: ui-monospace, Consolas, monospace; font-size: .82rem; }
.label { font-size: .78rem; font-weight: 600; background: var(--bg); border-radius: 4px; padding: .05rem .4rem; display: inline-block; margin-bottom: .4rem; }
.composer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); box-shadow: var(--shadow-up); padding: .75rem 1rem 1rem; }
.composer .inner { max-width: 920px; margin: 0 auto; }
.card-setup { background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; padding: .9rem 1rem; }
.setup-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: .75rem; flex-wrap: wrap; }
.setup-top .data { font-size: .85rem; }
.setup-top .data b { display: block; font-size: .75rem; font-weight: 400; opacity: .75; }
.btn-ghost { font: inherit; font-size: .9rem; border: 1px solid var(--text); background: var(--surface); color: var(--text); border-radius: 8px; padding: .4rem .9rem; cursor: pointer; }
.btn-ghost:hover, .btn-ghost:focus-visible { background: var(--ns-green); color: var(--ns-white); outline: 2px solid var(--focus); outline-offset: 2px; }
.pills { display: flex; flex-wrap: wrap; gap: .45rem; }
.pills button { font: inherit; font-size: .86rem; text-align: left; border: 0; box-shadow: var(--shadow); background: var(--surface); color: var(--text); border-radius: 999px; padding: .3rem .8rem; cursor: pointer; }
.pills button:hover, .pills button:focus-visible { background: var(--ns-green); color: var(--ns-white); outline: 2px solid var(--focus); outline-offset: 2px; }
.composer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); box-shadow: var(--shadow-up); padding: .75rem 1rem 1rem; }
.composer .inner { max-width: 920px; margin: 0 auto; display: flex; gap: .5rem; }
.composer input { flex: 1; font: inherit; padding: .6rem .8rem; border: 1px solid var(--text); border-radius: 8px; background: var(--bg); color: var(--text); }
.composer input:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.composer button { font: inherit; font-weight: 600; padding: .6rem 1.1rem; border: 1px solid var(--text); border-radius: 8px; background: var(--ns-green); color: var(--ns-white); cursor: pointer; }
.explain { margin-top: .9rem; padding-top: .2rem; }
.explain-text { margin: .2rem 0; white-space: pre-wrap; }
.explain-model { font-size: .75rem; opacity: .7; }
.foot { font-size: .8rem; text-align: center; margin: .5rem auto 0; max-width: 920px; }
</style>
</head>
<body>
<header class="top">
  <h1>Energy harness · KPI chat</h1>
  <span class="tag">SYNTHETIC DATA</span>
</header>

<main class="chat" id="chat">
  <section class="card-setup" aria-label="Standard requests">
    <div class="setup-top">
      <div class="data"><b>Data</b>Synthetic 30-day portfolio (no company data)</div>
      <button type="button" class="btn-ghost" id="new">New conversation</button>
    </div>
    <div class="pills" id="chips"></div>
  </section>
  <div id="log" aria-live="polite" style="display:flex;flex-direction:column;gap:1rem"></div>
</main>

<section class="composer" aria-label="Ask a question">
  <form id="ask" class="inner">
    <input id="q" type="text" autocomplete="off" placeholder="Ask about a KPI, e.g. performance ratio (Enter to send)" aria-label="Your question">
    <button type="submit">Ask</button>
  </form>
  <p class="foot">Answers are calculated in your browser from a synthetic 30-day dataset. Nothing is sent anywhere.</p>
</section>

<script src="config.js"></script>
<script src="kpi.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
<script>
const K = window.KPI, DATA = KPI_DATA.build(), ENGINE = window.KPI_ENGINE;
const chat = document.getElementById("log");
// Standard requests. Each pill shows and sends the full question.
const TAGS = [
  { group: "Solar generation", items: [
    ["Actual vs expected", "What is the actual vs expected generation for this period?"],
    ["Performance ratio", "What is the performance ratio of each park?"],
    ["Availability", "What is the availability of the parks this period?"],
    ["Capacity factor", "What is the capacity factor of the portfolio?"],
  ]},
  { group: "Energy commercial", items: [
    ["PPA delivery", "What is the PPA delivery against the contract?"],
    ["Realised price", "What is the realised (capture) price for the period?"],
    ["Merchant exposure", "What is the merchant price exposure?"],
  ]},
  { group: "Asset operations", items: [
    ["Downtime", "How many hours of downtime did the parks have?"],
    ["Energy losses", "What are the energy losses against expected output?"],
    ["Incident resolution", "What is the median incident resolution time?"],
  ]},
  { group: "Battery storage", items: [
    ["Battery", "What are the battery availability, round-trip efficiency and cycle utilisation?"],
  ]},
  { group: "General", items: [
    ["Headline", "Give me the headline KPIs for this period."],
    ["Help", "What can I ask?"],
  ]},
];

function el(tag, cls, html) { const n = document.createElement(tag); if (cls) n.className = cls; if (html !== undefined) n.innerHTML = html; return n; }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function tile(k) {
  if (k.unavailable) return `<div class="tile unavailable"><div class="k">${esc(k.title)}</div><div class="v">Unavailable</div><div class="why">${esc(k.unavailable)}</div></div>`;
  return `<div class="tile"><div class="k">${esc(k.title)}</div><div class="v">${k.value.toFixed(k.decimals)} ${esc(k.unit)}</div></div>`;
}

// Inline SVG charts: green for the main series, outlined for the second (no red in the palette).
function lineChart(c) {
  const W = 860, H = 240, pad = { l: 46, r: 12, t: 12, b: 28 };
  const all = c.series.flatMap((s) => s.values);
  const min = Math.min(0, ...all), max = Math.max(...all) * 1.08 || 1;
  const x = (i) => pad.l + (i / Math.max(1, c.labels.length - 1)) * (W - pad.l - pad.r);
  const y = (v) => H - pad.b - ((v - min) / (max - min)) * (H - pad.t - pad.b);
  const path = (vals) => vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const grid = [0, 0.25, 0.5, 0.75, 1].map((f) => { const v = min + f * (max - min); return `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" stroke-opacity=".12"/><text x="${pad.l - 6}" y="${y(v) + 4}" text-anchor="end">${v.toFixed(0)}</text>`; }).join("");
  const xl = c.labels.map((l, i) => (i % 3 === 0 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>` : "")).join("");
  const lines = c.series.map((s, k) => `<path d="${path(s.values)}" fill="none" stroke="${k ? "currentColor" : "#1A5C00"}" stroke-width="${k ? 1.6 : 2.6}" stroke-dasharray="${k ? "5 4" : ""}"/>`).join("");
  const legend = c.series.map((s, k) => `<text x="${pad.l + k * 120}" y="${pad.t + 10}" style="font-weight:600">${k ? "- - " : "— "}${esc(s.name)}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}">${grid}${lines}${xl}${legend}</svg>`;
}

function barChart(c) {
  const W = 860, H = 220, pad = { l: 46, r: 12, t: 14, b: 40 };
  const vals = c.bars.map((b) => b.value ?? 0);
  const min = Math.min(0, ...vals), max = Math.max(0, ...vals) * 1.1 || 1;
  const band = (W - pad.l - pad.r) / c.bars.length;
  const y = (v) => H - pad.b - ((v - min) / (max - min)) * (H - pad.t - pad.b);
  const zero = y(0);
  const bars = c.bars.map((b, i) => {
    const v = b.value ?? 0, bx = pad.l + i * band + band * 0.2, bw = band * 0.6;
    const top = Math.min(y(v), zero), h = Math.abs(y(v) - zero);
    const style = v < 0 ? `fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"` : `fill="#1A5C00"`;
    const shown = b.value === null ? "n/a" : (Number.isInteger(v) ? v : v.toFixed(1));
    return `<rect x="${bx}" y="${top}" width="${bw}" height="${Math.max(h, 1)}" ${style}/>` +
      `<text x="${bx + bw / 2}" y="${top - 4}" text-anchor="middle">${esc(shown)}</text>` +
      `<text x="${bx + bw / 2}" y="${H - 22}" text-anchor="middle">${esc(b.label)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}"><line x1="${pad.l}" x2="${W - pad.r}" y1="${zero}" y2="${zero}" stroke="currentColor" stroke-opacity=".5"/>${bars}</svg>`;
}

function botMessage(reply) {
  const box = el("div", "msg bot");
  box.innerHTML = `<pre>${esc(reply.text)}</pre>` +
    (reply.kpis.length ? `<div class="tiles">${reply.kpis.map(tile).join("")}</div>` : "") +
    (reply.chart ? `<figure><figcaption>${esc(reply.chart.title)}</figcaption>${reply.chart.kind === "line" ? lineChart(reply.chart) : barChart(reply.chart)}</figure>` : "") +
    (reply.trace.length ? `<details><summary>How the calculator got this</summary><ul>${reply.trace.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></details>` : "");
  return box;
}

function say(text) { const m = el("div", "msg user", esc(text)); chat.appendChild(m); m.scrollIntoView({ block: "end" }); }
function answer(text) {
  const reply = ENGINE.ask(text, DATA, K);
  const msg = botMessage(reply);
  chat.appendChild(msg);
  msg.scrollIntoView({ block: "start" });
  explainWithModel(text, reply, msg);
}

// The calculator's numbers go to the local server, which asks the model to explain them.
// The model may only quote those numbers; the server checks each one. On the static site there is no server: nothing is shown.
async function explainWithModel(question, reply, msg) {
  const results = reply.kpis.map((k) => ({
    title: k.title,
    value: k.value,
    display: k.value === null ? null : `${k.value.toFixed(k.decimals)} ${k.unit}`,
    unavailable: k.unavailable,
  }));
  const box = el("div", "explain", `<span class="label">Explanation (model)</span><p class="explain-text">Asking the model…</p>`);
  msg.appendChild(box);
  try {
    const res = await fetch((window.KPI_API_BASE || "") + "/api/explain", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, results }) });
    const data = await res.json().catch(() => null); // static site: no JSON, so there is no server
    if (!data) throw new Error("no server");
    box.querySelector(".explain-text").textContent = data.verified ? data.text : (data.note || data.error || "No explanation available.");
    if (data.model) box.insertAdjacentHTML("beforeend", `<small class="explain-model">${esc(data.model)}</small>`);
  } catch (e) {
    box.remove(); // no server (static site): the calculator answer stands on its own
  }
}

document.getElementById("ask").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = document.getElementById("q");
  const text = input.value.trim();
  if (!text) return;
  say(text); answer(text); input.value = "";
});

const chips = document.getElementById("chips");
TAGS.forEach((g) => g.items.forEach(([tag, request]) => {
  const b = el("button", "", esc(request)); b.type = "button"; b.title = tag;
  b.addEventListener("click", () => { say(request); answer(request); });
  chips.appendChild(b);
}));
document.getElementById("new").addEventListener("click", () => { chat.innerHTML = ""; greet(); });
function greet() {
  chat.appendChild(botMessage({ label: DATA.label, text: `Hello. I answer KPI questions for a fictional 30-day portfolio (${DATA.period.start} to ${DATA.period.end}). Pick a question above or type your own. Every number comes from the calculator; if an input is missing, I say so instead of guessing.`, kpis: [], chart: null, trace: [] }));
}
greet();

</script>
</body>
</html>
