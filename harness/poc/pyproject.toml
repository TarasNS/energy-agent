[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-harness"
version = "0.1.0"
description = "Minimal agent harness on OpenRouter free models, with PV, price and irradiance tools"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
energy-harness = "energy_harness.cli:main"
energy-harness-probe = "energy_harness.probe:main"
energy-harness-sim = "energy_harness.energy.sim.cli:main"
energy-harness-eval = "energy_harness.evals:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
